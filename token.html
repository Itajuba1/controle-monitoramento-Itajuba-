<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Token da Portaria - SENAI Itajubá</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #005691;
            --primary-dark: #003f6b;
            --success: #10b981;
            --bg-color: #f4f6f9;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 5px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .token-box {
            background: #e0f2fe;
            border: 3px dashed #0284c7;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .token-display {
            font-size: 64px;
            font-weight: bold;
            color: #0369a1;
            letter-spacing: 8px;
            margin: 0;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-success {
            background-color: var(--success);
            margin-top: 10px;
        }
        .btn-success:hover {
            background-color: #059669;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔑 Portaria SENAI Itajubá</h1>
        <p>Código presencial atual para validação de retirada e devolução de chaves:</p>

        <div class="token-box">
            <div id="token-atual" class="token-display">--</div>
        </div>

        <button class="btn" onclick="gerarNovoToken()">Gerar Novo Token Agora</button>
        
        <div style="margin-top: 15px;">
            <a href="index.html" style="color: #64748b; text-decoration: none; font-size: 13px;">← Voltar para a Tela Principal de Ambientes</a>
        </div>
    </div>

    <footer>
        <p><strong>Iniciativa 4.0</strong> - Sistema de Controle de Ambientes</p>
    </footer>

    <script>
        // Configuração do Firebase do projeto Itajubá
        const firebaseConfig = {
            apiKey: "AIzaSyDg9vM1RnmPJhIi80E_KE_R_Z-G7myhtds",
            authDomain: "monitoramento-de-ambientes.firebaseapp.com",
            databaseURL: "https://monitoramento-de-ambientes-default-rtdb.firebaseio.com",
            projectId: "monitoramento-de-ambientes",
            storageBucket: "monitoramento-de-ambientes.firebasestorage.app",
            messagingSenderId: "883987254699",
            appId: "1:883987254699:web:4f90e005aca08710a856ee"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const tokenDisplay = document.getElementById('token-atual');

        // Ouve em tempo real o token atual salvo no banco de dados
        db.ref('tokenSeguranca/codigo').on('value', (snapshot) => {
            const codigo = snapshot.val();
            tokenDisplay.textContent = codigo || "A1";
        });

        // Função para gerar um código aleatório de 2 caracteres (ex: A9, B4, X7)
        function gerarNovoToken() {
            const letras = "ABCDEFGHJKLMNPQRSTUVWXYZ"; // Sem I e O para evitar confusão com números
            const numeros = "23456789"; // Sem 0 e 1 para evitar confusão com letras
            
            const letraAleatoria = letras.charAt(Math.floor(Math.random() * letras.length));
            const numeroAleatorio = numeros.charAt(Math.floor(Math.random() * numeros.length));
            
            const novoCodigo = letraAleatoria + numeroAleatorio;

            // Salva o novo código no Firebase (atualiza instantaneamente na portaria e na tela principal)
            db.ref('tokenSeguranca').set({
                codigo: novoCodigo,
                atualizadoEm: new Date().toISOString()
            }, (error) => {
                if (error) {
                    alert("Erro ao atualizar o token: " + error.message);
                } else {
                    alert(`Novo Token gerado com sucesso: ${novoCodigo}`);
                }
            });
        }
    </script>
</body>
</html>
